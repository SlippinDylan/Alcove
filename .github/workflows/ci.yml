name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Report toolchain
        run: |
          xcodebuild -version
          node --version

      - name: Validate automation
        run: |
          bash -n Scripts/create-dmg.sh
          Scripts/create-dmg.sh --help >/dev/null
          node .github/scripts/release-manifest.mjs validate
          node --test .github/scripts/*.test.mjs

      - name: Reject unsafe production constructs
        run: |
          if grep -REn --include='*.swift' \
            'as!|try!|@unchecked Sendable|nonisolated\(unsafe\)' \
            Alcove Packages/AlcoveCore/Sources; then
            exit 1
          fi
          if grep -REn --include='*.swift' \
            'trashItem|recycleURLs|performFileOperation|moveItem|copyItem' \
            Alcove/FileGrid Alcove/PortalPresentation Alcove/PortalWindowing; then
            exit 1
          fi

      - name: Test AlcoveCore
        run: swift test --package-path Packages/AlcoveCore

      - name: Test hosted app
        run: |
          set -o pipefail
          xcodebuild test \
            -project Alcove.xcodeproj \
            -scheme Alcove \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData-Tests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build unsigned arm64 app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Alcove.xcodeproj \
            -scheme Alcove \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData-Release \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify artifact contract
        run: |
          app='build/DerivedData-Release/Build/Products/Release/Alcove.app'
          binary="$app/Contents/MacOS/Alcove"
          test "$(lipo -archs "$binary")" = 'arm64'
          test "$(vtool -show-build "$binary" | grep -c 'minos 15.0')" -eq 1
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist")" = 'true'
