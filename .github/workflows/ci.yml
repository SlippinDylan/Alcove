name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Report toolchain
        run: xcodebuild -version

      - name: Reject unsafe production constructs
        run: |
          if grep -REn --include='*.swift' \
            'as!|try!|@unchecked Sendable|nonisolated\(unsafe\)' \
            Alcove Packages/AlcoveCore/Sources; then
            exit 1
          fi
          if grep -REn --include='*.swift' \
            'trashItem|recycleURLs|performFileOperation|moveItem|copyItem' \
            Alcove/FileGrid Alcove/PortalPresentation Alcove/PortalWindowing; then
            exit 1
          fi

      - name: Test AlcoveCore
        run: swift test --package-path Packages/AlcoveCore

      - name: Test hosted app
        run: |
          set -o pipefail
          xcodebuild test \
            -project Alcove.xcodeproj \
            -scheme Alcove \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData-Tests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build unsigned universal app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Alcove.xcodeproj \
            -scheme Alcove \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData-Release \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify artifact contract
        run: |
          app='build/DerivedData-Release/Build/Products/Release/Alcove.app'
          binary="$app/Contents/MacOS/Alcove"
          lipo "$binary" -verify_arch arm64 x86_64
          test "$(vtool -show-build "$binary" | grep -c 'minos 15.0')" -eq 2
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist")" = 'true'
          ditto -c -k --sequesterRsrc --keepParent "$app" build/Alcove-unsigned.zip

      - name: Upload unsigned app
        uses: actions/upload-artifact@v7
        with:
          name: Alcove-unsigned-universal
          path: build/Alcove-unsigned.zip
          if-no-files-found: error
          retention-days: 14
